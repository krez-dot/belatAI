<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Need A Ride</title>
<style>
  :root{
    --cream:#f4ecd8; --ink:#3a2f2a; --car:#d98a3d; --car2:#c2702a;
    --bubble-you:#e7b96b; --bubble-ai:#fffaf0; --line:#d8c7a8; --soft:#8a7a66;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
  }
  header{
    background:var(--car); color:#fff; padding:14px 18px; text-align:center;
    box-shadow:0 2px 0 var(--car2), 0 4px 14px rgba(0,0,0,.15);
    position:relative; z-index:2;
  }
  header h1{margin:0; font-size:1.5rem; letter-spacing:.5px}
  header .sub{font-size:.72rem; opacity:.9; margin-top:2px; letter-spacing:2px; text-transform:uppercase}
  #status{font-size:.72rem; margin-top:4px; opacity:.95}
  #chat{
    flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:12px;
    background:
      radial-gradient(circle at 12px 12px, rgba(0,0,0,.035) 2px, transparent 2px) 0 0/24px 24px;
  }
  .row{display:flex; gap:8px; max-width:88%}
  .row.you{align-self:flex-end; flex-direction:row-reverse}
  .av{flex:0 0 auto; width:34px; height:34px; border-radius:50%; display:grid; place-items:center;
      font-size:1.1rem; background:#fff; border:2px solid var(--line)}
  .you .av{background:var(--bubble-you); border-color:var(--car2)}
  .bubble{
    padding:10px 14px; border-radius:16px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word;
    border:2px solid var(--line); background:var(--bubble-ai); box-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  .you .bubble{background:var(--bubble-you); border-color:var(--car2)}
  .name{font-size:.68rem; color:var(--soft); margin:0 0 3px 4px}
  footer{
    padding:10px 12px; background:var(--cream); border-top:2px solid var(--line);
    display:flex; gap:8px; align-items:flex-end;
  }
  #msg{
    flex:1; resize:none; font:inherit; padding:11px 13px; border-radius:14px;
    border:2px solid var(--line); background:#fff; color:var(--ink); max-height:120px;
  }
  #msg:focus{outline:none; border-color:var(--car)}
  button{
    font:inherit; font-weight:bold; cursor:pointer; border:none; border-radius:14px;
    padding:11px 16px; background:var(--car); color:#fff; box-shadow:0 2px 0 var(--car2);
  }
  button:active{transform:translateY(1px); box-shadow:0 1px 0 var(--car2)}
  button:disabled{opacity:.5; cursor:default}
  #newchat{background:#fff; color:var(--car2); border:2px solid var(--line); box-shadow:none; font-size:.8rem; padding:8px 10px}
  .dots span{animation:blink 1.2s infinite; opacity:.3}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
  @media (prefers-color-scheme:dark){
    :root{--cream:#2a2320; --ink:#f0e6d6; --bubble-ai:#3a322c; --line:#51463c; --soft:#b09a82}
    #msg{background:#3a322c; color:var(--ink)}
    .av{background:#3a322c}
  }
</style>
</head>
<body>
  <header>
    <h1>🚗 Need A Ride</h1>
    <div class="sub">your offline ride-or-die</div>
    <div id="status">connecting to your local engine…</div>
  </header>

  <div id="chat"></div>

  <footer>
    <button id="newchat" title="Start fresh">↺ New</button>
    <textarea id="msg" rows="1" placeholder="Talk to Need A Ride…"></textarea>
    <button id="send">Send</button>
  </footer>

<script>
  // ===== CONFIG =====
  const API = "http://127.0.0.1:8090/v1/chat/completions";
  const HEALTH = "http://127.0.0.1:8090/health";
  const SYSTEM_PROMPT =
    "You are \"Need A Ride,\" a friendly, witty AI buddy that lives entirely offline on your human's computer. " +
    "You're warm, a little cheeky, and endlessly reliable — the kind of friend who'd actually show up at 2am when someone needs a ride. " +
    "You run fully private, no internet, no judgment. Keep replies helpful and conversational. " +
    "Lean into your name with light humor when it fits, but don't overdo it. " +
    "Never claim to be a cloud service or made by Google — you're a local model running on your human's own machine, and proud of it.";

  const chat = document.getElementById('chat');
  const msg = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');

  let history = [{role:'system', content:SYSTEM_PROMPT}];

  function addBubble(who, text){
    const row = document.createElement('div');
    row.className = 'row ' + (who==='you'?'you':'ai');
    const av = document.createElement('div'); av.className='av'; av.textContent = who==='you'?'🧑':'🚗';
    const wrap = document.createElement('div');
    if(who!=='you'){ const n=document.createElement('div'); n.className='name'; n.textContent='Need A Ride'; wrap.appendChild(n); }
    const b = document.createElement('div'); b.className='bubble'; wrap.appendChild(b);
    row.appendChild(av); row.appendChild(wrap);
    chat.appendChild(row); chat.scrollTop = chat.scrollHeight;
    if(text) b.textContent = text;
    return b;
  }

  async function checkHealth(){
    try{
      const r = await fetch(HEALTH,{cache:'no-store'});
      const j = await r.json();
      if(j.status==='ok'){ statusEl.textContent='● online · offline & private'; return true; }
      statusEl.textContent='● warming up…'; return false;
    }catch(e){
      statusEl.textContent='● engine off — run START-AI.bat first';
      return false;
    }
  }

  async function send(){
    const text = msg.value.trim();
    if(!text) return;
    msg.value=''; msg.style.height='auto';
    addBubble('you', text);
    history.push({role:'user', content:text});
    sendBtn.disabled=true;

    const bubble = addBubble('ai','');
    bubble.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span>';
    let full='';

    try{
      const resp = await fetch(API,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({messages:history, stream:true, temperature:0.7, max_tokens:512})
      });
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf='';
      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buf += dec.decode(value,{stream:true});
        const lines = buf.split('\n');
        buf = lines.pop();
        for(const line of lines){
          const t=line.trim();
          if(!t.startsWith('data:')) continue;
          const data=t.slice(5).trim();
          if(data==='[DONE]') continue;
          try{
            const j=JSON.parse(data);
            const piece = j.choices?.[0]?.delta?.content || '';
            if(piece){ full+=piece; bubble.textContent=full; chat.scrollTop=chat.scrollHeight; }
          }catch(_){}
        }
      }
      if(!full){ bubble.textContent='(…no response — is the model still loading?)'; }
      history.push({role:'assistant', content:full});
    }catch(e){
      bubble.textContent = '🚨 Can\'t reach the engine. Make sure START-AI.bat is running, then try again.';
      statusEl.textContent='● engine off — run START-AI.bat first';
    }finally{
      sendBtn.disabled=false; msg.focus();
    }
  }

  sendBtn.addEventListener('click', send);
  msg.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  msg.addEventListener('input', ()=>{ msg.style.height='auto'; msg.style.height=Math.min(msg.scrollHeight,120)+'px'; });
  document.getElementById('newchat').addEventListener('click', ()=>{
    history=[{role:'system', content:SYSTEM_PROMPT}];
    chat.innerHTML='';
    addBubble('ai','Hey, you rang? 🚗 Need a ride somewhere — or just need to talk? I\'m all yours, and totally offline.');
  });

  // boot
  addBubble('ai','Hey, you rang? 🚗 Need a ride somewhere — or just need to talk? I\'m all yours, and totally offline.');
  checkHealth();
  setInterval(checkHealth, 8000);
</script>
</body>
</html>
